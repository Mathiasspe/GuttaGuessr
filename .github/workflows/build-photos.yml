name: Build photo list

on:
  push:
    branches: [main]
    paths:
      - "photos/**"
      - "hints.json"
      - "scripts/build_photos.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-photos
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install Pillow

      - run: python scripts/build_photos.py

      - name: Commit photos.json and hints.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photos.json hints.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update photo list"
            git pull --rebase
            git push
          fi
